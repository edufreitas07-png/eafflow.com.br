<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Minhas vendas</title>
<link rel="manifest" href="/manifest-vendas.webmanifest">
<meta name="theme-color" content="#0b1b3a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Vendas">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="/icon-vendas-180.png">
<link rel="icon" type="image/png" href="/icon-vendas-192.png">
<style>
  :root { --navy:#0b1b3a; --green:#22c55e; --edge:#15803d; --paper:#f5f8fc; --ink:#0b1630; --muted:#4a5b78; --orange:#fb923c; }
  * { box-sizing:border-box; }
  body { margin:0; font:16px/1.5 system-ui,sans-serif; background:var(--paper); color:var(--ink); padding:16px 16px 60px; }
  main { max-width:640px; margin:0 auto; }
  h1 { margin:8px 0 14px; font-size:1.6rem; }
  input, button { font:inherit; }
  input { width:100%; padding:14px; border:2px solid #cbd6e8; border-radius:12px; background:#fff; }
  .btn { display:inline-flex; align-items:center; justify-content:center; padding:13px 18px; border-radius:12px; border:0; background:var(--green); color:#04200d; font-weight:700; cursor:pointer; text-decoration:none; box-shadow:0 3px 0 var(--edge); }
  .btn.sec { background:#fff; color:var(--navy); border:2px solid var(--navy); box-shadow:none; }
  .btn.mini { padding:9px 12px; font-size:.9rem; }
  .linha { display:flex; gap:10px; flex-wrap:wrap; }
  .abas { display:flex; gap:8px; margin:14px 0; }
  .abas button { flex:1; padding:11px; border-radius:999px; border:2px solid var(--navy); background:#fff; font-weight:700; cursor:pointer; }
  .abas button.on { background:var(--navy); color:#fff; }
  .card { background:#fff; border:2px solid var(--navy); border-radius:18px; padding:16px; margin-bottom:12px; }
  .card h3 { margin:0 0 2px; font-size:1.1rem; }
  .card small { color:var(--muted); display:block; }
  .tag { display:inline-block; padding:3px 10px; border-radius:999px; font-size:.75rem; font-weight:700; background:var(--orange); color:#3b1a00; margin-bottom:8px; }
  .tag.ok { background:var(--green); color:#04200d; }
  .acoes { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
  .aviso { background:#fff4e5; border:2px solid var(--orange); border-radius:14px; padding:12px; margin:12px 0; font-size:.95rem; }
  #erro { color:#b3261e; font-weight:600; margin-top:10px; white-space:pre-wrap; word-break:break-word; }
  .vazio { color:var(--muted); text-align:center; padding:30px 0; }
  .topo { display:flex; justify-content:space-between; align-items:center; gap:10px; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main>
  <section id="login">
    <h1>Minhas vendas</h1>
    <p>Área só do vendedor.</p>
    <input id="senha" type="password" placeholder="Senha" autocomplete="current-password">
    <p><button class="btn" id="entrar" style="width:100%;margin-top:12px">Entrar</button></p>
    <div id="erro" role="alert"></div>
  </section>

  <section id="painel" hidden>
    <div class="topo"><h1>Minhas vendas</h1><div class="linha"><button class="btn sec mini" id="atualizar">Atualizar</button><button class="btn sec mini" id="abrirSenha">Senha</button><button class="btn sec mini" id="sair">Sair</button></div></div>
    <div class="aviso" id="avisoLink" hidden>
      O link do curso ainda não está configurado no servidor. Cole aqui o link da pasta do Drive (fica salvo neste aparelho):
      <input id="linkManual" placeholder="https://drive.google.com/..." style="margin-top:8px">
    </div>
    <section id="boxSenha" class="card" hidden>
      <h3>Trocar senha</h3>
      <small>Mínimo 10 caracteres. Ao trocar, os outros aparelhos saem da conta.</small>
      <input id="senhaAtual" type="password" placeholder="Senha atual" autocomplete="current-password" style="margin-top:10px">
      <input id="senhaNova" type="text" placeholder="Nova senha" autocomplete="new-password" style="margin-top:8px">
      <div class="acoes">
        <button class="btn sec mini" id="gerar">Gerar senha aleatória</button>
        <button class="btn sec mini" id="copiar">Copiar</button>
      </div>
      <div class="acoes"><button class="btn mini" id="salvarSenha">Salvar nova senha</button><button class="btn sec mini" id="fecharSenha">Fechar</button></div>
      <div id="msgSenha" role="status" style="margin-top:10px;font-weight:600"></div>
    </section>
    <div class="abas"><button id="abaPend" class="on">A enviar (0)</button><button id="abaOk">Enviados (0)</button></div>
    <div id="lista"></div>
  </section>
</main>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  let token = '', pedidos = [], links = {}, aba = 'pend';
  const guardar = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
  const ler = (k) => { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } };
  const lerL = (k) => { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } };
  const guardarL = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };

  async function api(metodo, corpo) {
    const r = await fetch('/api/admin', {
      method: metodo,
      headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' },
      body: corpo ? JSON.stringify(corpo) : undefined
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) { const e = new Error(erroTxt(j)); e.status = r.status; throw e; }
    return j;
  }
  function erroTxt(j) { return (j.error || 'Erro') + (j.dica ? '\n' + j.dica : '') + (j.detalhe ? '\n(' + j.detalhe + ')' : ''); }
  async function login(senha) {
    const r = await fetch('/api/admin', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ acao: 'login', senha }) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(erroTxt(j));
    return j.token;
  }

  function nomeCurso(nsu) { return String(nsu).startsWith('site-') ? 'Criar Site pelo Celular' : 'Curso de higienização'; }
  function linkDoPedido(p) {
    const base = String(p.order_nsu).startsWith('site-') ? links.site : links.outro;
    return base || lerL('linkManual') || '';
  }
  function zapUrl(p) {
    let d = String(p.whatsapp || '').replace(/\D/g, '');
    if (d.length <= 11) d = '55' + d;
    const link = linkDoPedido(p);
    const primeiro = String(p.nome || '').trim().split(/\s+/)[0] || '';
    const msg = `Olá, ${primeiro}! Seu pagamento foi confirmado. Aqui está o seu acesso ao curso ${nomeCurso(p.order_nsu)}:\n${link}\n\nQualquer dúvida de pagamento ou de acesso, é só chamar aqui.`;
    return `https://wa.me/${d}?text=${encodeURIComponent(msg)}`;
  }
  function data(s) { return s ? new Date(s).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' }) : ''; }

  function desenhar() {
    const pend = pedidos.filter((p) => p.status !== 'entregue');
    const ok = pedidos.filter((p) => p.status === 'entregue');
    $('abaPend').textContent = `A enviar (${pend.length})`;
    $('abaOk').textContent = `Enviados (${ok.length})`;
    $('abaPend').classList.toggle('on', aba === 'pend');
    $('abaOk').classList.toggle('on', aba === 'ok');
    $('avisoLink').hidden = !!links.site;
    const lista = $('lista'); lista.textContent = '';
    const itens = aba === 'pend' ? pend : ok;
    if (!itens.length) { const v = document.createElement('p'); v.className = 'vazio'; v.textContent = aba === 'pend' ? 'Nenhuma venda para enviar.' : 'Nada enviado ainda.'; lista.appendChild(v); return; }
    itens.forEach((p) => {
      const c = document.createElement('article'); c.className = 'card';
      const tag = document.createElement('span'); tag.className = 'tag' + (p.status === 'entregue' ? ' ok' : ''); tag.textContent = p.status === 'entregue' ? 'Enviado' : 'Enviar acesso'; c.appendChild(tag);
      const h = document.createElement('h3'); h.textContent = p.nome; c.appendChild(h);
      [nomeCurso(p.order_nsu) + (p.forma_pagamento ? ' · ' + p.forma_pagamento : ''), p.email, p.whatsapp, 'Pago em ' + data(p.pago_em) + (p.entregue_em ? ' · enviado em ' + data(p.entregue_em) : '')].forEach((t) => { const s = document.createElement('small'); s.textContent = t; c.appendChild(s); });
      const ac = document.createElement('div'); ac.className = 'acoes';
      const w = document.createElement('a'); w.className = 'btn mini'; w.target = '_blank'; w.rel = 'noopener'; w.textContent = 'Enviar acesso no WhatsApp';
      if (linkDoPedido(p)) w.href = zapUrl(p); else { w.href = '#'; w.addEventListener('click', (e) => { e.preventDefault(); alert('Cole o link do curso no campo de aviso, no topo.'); }); }
      ac.appendChild(w);
      const m = document.createElement('button'); m.className = 'btn sec mini'; m.textContent = p.status === 'entregue' ? 'Desmarcar enviado' : 'Marcar como enviado';
      m.addEventListener('click', async () => { m.disabled = true; try { await api('POST', { order_nsu: p.order_nsu, enviado: p.status !== 'entregue' }); await carregar(); } catch (e) { alert(e.message); m.disabled = false; } });
      ac.appendChild(m);
      c.appendChild(ac); lista.appendChild(c);
    });
  }

  async function carregar() {
    const j = await api('GET');
    pedidos = j.pedidos; links = j.links || {};
    desenhar();
  }

  async function entrar() {
    $('erro').textContent = '';
    try {
      if (!token) { const sn = $('senha').value; if (!sn) return; token = await login(sn); }
      await carregar();
      guardar('token', token);
      $('senha').value = '';
      $('login').hidden = true; $('painel').hidden = false;
    } catch (e) { token = ''; guardar('token', ''); $('login').hidden = false; $('painel').hidden = true; $('erro').textContent = e.message; }
  }
  function gerarSenha() {
    const al = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789';
    const v = new Uint32Array(16); crypto.getRandomValues(v);
    return Array.from(v, (n) => al[n % al.length]).join('');
  }
  async function salvarSenha() {
    const msg = $('msgSenha'); msg.style.color = ''; msg.textContent = '';
    try {
      const nova = $('senhaNova').value;
      const j = await api('POST', { acao: 'trocar', senhaAtual: $('senhaAtual').value, novaSenha: nova });
      token = j.token; guardar('token', token);
      msg.style.color = '#15803d'; msg.textContent = 'Senha trocada. Guarde a nova senha em um lugar seguro.';
      $('senhaAtual').value = '';
    } catch (e) { msg.style.color = '#b3261e'; msg.textContent = e.message; }
  }

  $('entrar').addEventListener('click', entrar);
  $('senha').addEventListener('keydown', (e) => { if (e.key === 'Enter') entrar(); });
  $('atualizar').addEventListener('click', () => carregar().catch((e) => { if (e.status === 401) location.reload(); else alert(e.message); }));
  $('sair').addEventListener('click', () => { guardar('token', ''); location.reload(); });
  $('abaPend').addEventListener('click', () => { aba = 'pend'; desenhar(); });
  $('abaOk').addEventListener('click', () => { aba = 'ok'; desenhar(); });
  $('abrirSenha').addEventListener('click', () => { $('boxSenha').hidden = !$('boxSenha').hidden; });
  $('fecharSenha').addEventListener('click', () => { $('boxSenha').hidden = true; $('senhaNova').value = ''; $('msgSenha').textContent = ''; });
  $('gerar').addEventListener('click', () => { $('senhaNova').value = gerarSenha(); });
  $('copiar').addEventListener('click', async () => { try { await navigator.clipboard.writeText($('senhaNova').value); $('msgSenha').style.color = ''; $('msgSenha').textContent = 'Copiada.'; } catch (e) { $('senhaNova').select(); } });
  $('salvarSenha').addEventListener('click', salvarSenha);
  $('linkManual').value = lerL('linkManual');
  $('linkManual').addEventListener('input', () => { guardarL('linkManual', $('linkManual').value.trim()); desenhar(); });
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw-vendas.js').catch(() => {});
  token = ler('token');
  if (token) entrar();
})();
</script>
</body>
</html>
